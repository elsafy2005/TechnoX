<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechnoX — إدارة التقييمات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Cairo,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
.login-box{background:#111;border:1px solid #222;border-radius:16px;padding:40px;width:100%;max-width:380px;text-align:center;}
.login-box h2{margin-bottom:6px;font-size:1.4rem;}
.login-box p{color:#555;font-size:.85rem;margin-bottom:24px;}
.login-box input{width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:8px;color:#fff;font-family:Cairo,sans-serif;font-size:.95rem;margin-bottom:12px;outline:none;direction:ltr;}
.login-box input:focus{border-color:#555;}
.login-box ِِbutton{width:100%;pِِadding:12px;background:#e00000;border:none;border-radius:8px;color:#fff;font-family:Cairo,sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.login-box button:disabled{opacity:.5;cursor:default;}
.err{color:#e00000;font-size:.83rem;margin-top:10px;display:none;padding:8px;background:#1a0000;border-radius:6px;}
.admin-wrap{max-width:900px;margin:0 auto;padding:30px 16px;}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.admin-header h1{font-size:1.4rem;}
.btn-danger{background:#e00000;border:none;border-radius:8px;color:#fff;padding:10px 20px;font-family:Cairo,sans-serif;font-weight:700;cursor:pointer;font-size:.9rem;}
.btn-del{background:#1a0000;border:1px solid #e00000;border-radius:6px;color:#e00000;padding:6px 14px;font-family:Cairo,sans-serif;font-weight:700;cursor:pointer;font-size:.8rem;white-space:nowrap;}
.btn-del:hover{background:#e00000;color:#fff;}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:18px 20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
.info{}
.author{font-weight:800;margin-bottom:3px;}
.product{color:#e00000;font-size:.82rem;margin-bottom:3px;}
.stars{color:#f5a623;letter-spacing:1px;margin-bottom:3px;}
.comment{color:#bbb;font-size:.87rem;line-height:1.6;margin-top:4px;}
.date{color:#444;font-size:.73rem;margin-top:4px;}
.stats{background:#111;border:1px solid #222;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;gap:32px;flex-wrap:wrap;}
.stat{text-align:center;}
.stat-num{font-size:2rem;font-weight:900;color:#f5a623;}
.stat-label{font-size:.75rem;color:#555;margin-top:2px;}
.empty{text-align:center;padding:60px 20px;color:#444;background:#111;border:1px solid #222;border-radius:12px;}
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <h2>🔐 لوحة الإدارة</h2>
    <p>TechnoX — إدارة التقييمات والتعليقات</p>
    <input type="text" id="urlInput" placeholder="رابط Web App (exec)" autocomplete="off" spellcheck="false" />
    <input type="password" id="passInput" placeholder="كلمة السر" />
    <button id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="err" id="errMsg"></div>
  </div>
</div>

<div class="admin-wrap" id="adminScreen" style="display:none;">
  <div class="admin-header">
    <h1>⚙️ إدارة التقييمات</h1>
    <button class="btn-danger" onclick="clearAll()">🗑️ مسح الكل</button>
  </div>
  <div class="stats" id="statsBox"></div>
  <div id="reviewsList"></div>
</div>

<script>
var SHEET_URL = '';
var ADMIN_PASS = '';

// JSONP — يتجاوز CORS تماماً
function jsonp(url, callback) {
  var name = 'cb_' + Date.now();
  window[name] = function(data) {
    delete window[name];
    document.head.removeChild(script);
    callback(null, data);
  };
  var script = document.createElement('script');
  script.onerror = function() {
    delete window[name];
    document.head.removeChild(script);
    callback(new Error('فشل الاتصال'));
  };
  script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + name;
  document.head.appendChild(script);
}

function doLogin() {
  var url  = document.getElementById('urlInput').value.trim().replace(/[?&].*$/, '');
  var pass = document.getElementById('passInput').value.trim();
  if (!url || !pass) { showErr('⚠️ أدخل الرابط وكلمة السر'); return; }
  SHEET_URL  = url;
  ADMIN_PASS = pass;
  setBtn(true);
  jsonp(url + '?action=validateAdmin&pass=' + encodeURIComponent(pass), function(err, data) {
    setBtn(false);
    if (err)                         { showErr('❌ تعذّر الاتصال — تأكد من الرابط'); return; }
    if (data && data.error === 'unauthorized') { showErr('❌ كلمة السر غلط'); return; }
    if (data && data.error)          { showErr('❌ خطأ: ' + data.error); return; }
    loadReviews();
  });
}

function loadReviews() {
  jsonp(SHEET_URL + '?action=getReviews', function(err, data) {
    if (err || !Array.isArray(data)) { showErr('❌ فشل تحميل التقييمات'); return; }
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    renderReviews(data);
  });
}

function renderReviews(reviews) {
  var list  = document.getElementById('reviewsList');
  var stats = document.getElementById('statsBox');
  var avg   = reviews.length ? (reviews.reduce(function(s,r){return s+Number(r.rating);},0)/reviews.length).toFixed(1) : '0.0';
  stats.innerHTML =
    '<div class="stat"><div class="stat-num">' + reviews.length + '</div><div class="stat-label">إجمالي التقييمات</div></div>' +
    '<div class="stat"><div class="stat-num">' + avg + '</div><div class="stat-label">متوسط النجوم ⭐</div></div>';
  if (!reviews.length) {
    list.innerHTML = '<div class="empty">💬 لا توجد تقييمات</div>';
    return;
  }
  list.innerHTML = reviews.map(function(r) {
    var stars = '';
    for (var i = 1; i <= 5; i++) stars += i <= r.rating ? '★' : '☆';
    return '<div class="card" id="card-' + esc(r.id) + '">' +
      '<div class="info">' +
        '<div class="author">' + esc(r.author) + '</div>' +
        '<div class="product">' + esc(r.productName) + '</div>' +
        '<div class="stars">' + stars + '</div>' +
        (r.comment ? '<div class="comment">' + esc(r.comment) + '</div>' : '') +
        '<div class="date">' + esc(r.date) + '</div>' +
      '</div>' +
      '<button class="btn-del" onclick="deleteReview(\'' + esc(r.id) + '\')">🗑️ حذف</button>' +
    '</div>';
  }).join('');
}

function deleteReview(id) {
  if (!confirm('تمسح التقييم ده؟')) return;
  var card = document.getElementById('card-' + id);
  if (card) { card.style.opacity = '0.4'; card.style.pointerEvents = 'none'; }
  jsonp(SHEET_URL + '?action=deleteReview&id=' + encodeURIComponent(id) + '&pass=' + encodeURIComponent(ADMIN_PASS), function(err, data) {
    if (err || (data && data.error)) {
      if (card) { card.style.opacity = ''; card.style.pointerEvents = ''; }
      alert('❌ فشل الحذف');
      return;
    }
    if (card) card.remove();
    updateStats();
  });
}

function clearAll() {
  if (!confirm('هتمسح كل التقييمات؟ مينفعش ترجعهم!')) return;
  jsonp(SHEET_URL + '?action=clearAll&pass=' + encodeURIComponent(ADMIN_PASS), function(err, data) {
    if (err || (data && data.error)) { alert('❌ فشل المسح'); return; }
    renderReviews([]);
  });
}

function updateStats() {
  var count = document.querySelectorAll('.card').length;
  var el = document.querySelector('#statsBox .stat-num');
  if (el) el.textContent = count;
}

function showErr(msg) {
  var el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function setBtn(loading) {
  var btn = document.getElementById('loginBtn');
  btn.disabled = loading;
  btn.textContent = loading ? '...جاري التحقق' : 'دخول';
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

document.getElementById('passInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
