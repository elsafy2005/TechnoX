<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechnoX — إدارة التقييمات</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Cairo,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-box{background:#111;border:1px solid #222;border-radius:16px;padding:40px;width:100%;max-width:360px;text-align:center;}
  .login-box h2{margin-bottom:24px;font-size:1.4rem;}
  .login-box input{width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:8px;color:#fff;font-family:Cairo,sans-serif;font-size:1rem;margin-bottom:14px;outline:none;}
  .login-box button{width:100%;padding:12px;background:#e00000;border:none;border-radius:8px;color:#fff;font-family:Cairo,sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
  .admin-wrap{max-width:900px;margin:0 auto;padding:30px 16px;}
  .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:12px;}
  .admin-header h1{font-size:1.5rem;}
  .btn-danger{background:#e00000;border:none;border-radius:8px;color:#fff;padding:10px 20px;font-family:Cairo,sans-serif;font-weight:700;cursor:pointer;font-size:.9rem;}
  .btn-del{background:#1a0000;border:1px solid #e00000;border-radius:6px;color:#e00000;padding:6px 14px;font-family:Cairo,sans-serif;font-weight:700;cursor:pointer;font-size:.8rem;transition:background .2s;}
  .btn-del:hover{background:#e00000;color:#fff;}
  .review-card{background:#111;border:1px solid #222;border-radius:12px;padding:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .review-info{}
  .review-author{font-weight:800;margin-bottom:4px;}
  .review-product{color:#e00000;font-size:.82rem;margin-bottom:4px;}
  .review-stars{color:#f5a623;letter-spacing:2px;margin-bottom:4px;}
  .review-comment{color:#ccc;font-size:.88rem;line-height:1.6;}
  .review-date{color:#555;font-size:.75rem;margin-top:4px;}
  .empty{text-align:center;padding:60px 20px;color:#555;}
  .stats{background:#111;border:1px solid #222;border-radius:12px;padding:20px;margin-bottom:24px;display:flex;gap:30px;flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat-num{font-size:2rem;font-weight:900;color:#f5a623;}
  .stat-label{font-size:.78rem;color:#555;}
  #loginError{color:#e00000;font-size:.85rem;margin-top:10px;display:none;}
  .url-input{width:100%;padding:10px;background:#000;border:1px solid #333;border-radius:8px;color:#fff;font-family:Cairo,monospace;font-size:.78rem;margin-bottom:14px;outline:none;}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <h2>🔐 لوحة الإدارة</h2>
    <input type="text" id="urlInput" class="url-input" placeholder="رابط الـ Web App (https://script.google.com/...)" />
    <input type="password" id="passInput" placeholder="كلمة السر" />
    <button onclick="doLogin()">دخول</button>
    <div id="loginError">❌ كلمة السر غلط أو الرابط غلط</div>
  </div>
</div>

<!-- لوحة الإدارة -->
<div class="admin-wrap" id="adminScreen" style="display:none;">
  <div class="admin-header">
    <h1>⚙️ إدارة التقييمات</h1>
    <button class="btn-danger" onclick="clearAll()">🗑️ مسح الكل</button>
  </div>
  <div class="stats" id="statsBox"></div>
  <div id="reviewsList"></div>
</div>

<script>
var SHEET_URL = '';
var ADMIN_PASS = '';

function doLogin() {
  var url  = document.getElementById('urlInput').value.trim();
  var pass = document.getElementById('passInput').value.trim();
  if (!url || !pass) { showLoginError('⚠️ أدخل الرابط وكلمة السر'); return; }
  SHEET_URL  = url;
  ADMIN_PASS = pass;
  var btn = document.querySelector('.login-box button');
  btn.textContent = '...جاري التحقق';
  btn.disabled = true;
  fetch(SHEET_URL + '?action=validateAdmin&pass=' + encodeURIComponent(pass))
    .then(function(r){ return r.json(); })
    .then(function(data){
      btn.textContent = 'دخول'; btn.disabled = false;
      if (data.error === 'unauthorized') { showLoginError('❌ كلمة السر غلط'); return; }
      if (data.error) { showLoginError('❌ خطأ في الرابط أو Apps Script'); return; }
      fetch(SHEET_URL + '?action=getReviews')
        .then(function(r){ return r.json(); })
        .then(function(reviews){
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('adminScreen').style.display = 'block';
          renderReviews(Array.isArray(reviews) ? reviews : []);
        });
    })
    .catch(function(){
      btn.textContent = 'دخول'; btn.disabled = false;
      showLoginError('❌ تعذّر الاتصال — تأكد من الرابط');
    });
}

function showLoginError(msg) {
  var el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

function renderReviews(reviews) {
  var list = document.getElementById('reviewsList');
  var stats = document.getElementById('statsBox');
  var avg = reviews.length ? (reviews.reduce(function(s,r){return s+r.rating;},0)/reviews.length).toFixed(1) : '0';
  stats.innerHTML =
    '<div class="stat"><div class="stat-num">'+reviews.length+'</div><div class="stat-label">إجمالي التقييمات</div></div>' +
    '<div class="stat"><div class="stat-num">'+avg+'</div><div class="stat-label">متوسط النجوم</div></div>';

  if (!reviews.length) {
    list.innerHTML = '<div class="empty">💬 لا توجد تقييمات</div>';
    return;
  }
  list.innerHTML = reviews.map(function(r){
    var stars = '';
    for(var i=1;i<=5;i++) stars += i<=r.rating ? '★' : '☆';
    return '<div class="review-card" id="card-'+r.id+'">' +
      '<div class="review-info">' +
        '<div class="review-author">'+escHtml(r.author)+'</div>' +
        '<div class="review-product">'+escHtml(r.productName)+'</div>' +
        '<div class="review-stars">'+stars+'</div>' +
        (r.comment ? '<div class="review-comment">'+escHtml(r.comment)+'</div>' : '') +
        '<div class="review-date">'+escHtml(r.date)+'</div>' +
      '</div>' +
      '<button class="btn-del" onclick="deleteReview(\''+r.id+'\')">🗑️ حذف</button>' +
    '</div>';
  }).join('');
}

function deleteReview(id) {
  if (!confirm('تمسح التقييم ده؟')) return;
  var url = SHEET_URL + '?action=deleteReview&id=' + encodeURIComponent(id) + '&pass=' + encodeURIComponent(ADMIN_PASS);
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.success) {
        var card = document.getElementById('card-'+id);
        if (card) card.remove();
        updateStats();
      } else {
        alert('❌ فشل الحذف: ' + (d.error || 'خطأ'));
      }
    })
    .catch(function(){ alert('❌ تعذّر الاتصال'); });
}

function clearAll() {
  if (!confirm('هتمسح كل التقييمات والتعليقات؟ مينفعش ترجعهم!')) return;
  var url = SHEET_URL + '?action=clearAll&pass=' + encodeURIComponent(ADMIN_PASS);
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.success) renderReviews([]);
      else alert('❌ فشل: ' + (d.error || 'خطأ'));
    })
    .catch(function(){ alert('❌ تعذّر الاتصال'); });
}

function updateStats() {
  var cards = document.querySelectorAll('.review-card');
  var stats = document.getElementById('statsBox');
  stats.querySelector('.stat-num').textContent = cards.length;
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('passInput').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
